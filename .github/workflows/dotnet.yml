name: Build, Test, and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PartnerDataSharingMiddlewareDemo.slnx

      - name: Build
        run: dotnet build PartnerDataSharingMiddlewareDemo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PartnerDataSharingMiddlewareDemo.slnx --configuration Release --no-build --verbosity normal

      - name: Trigger Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
